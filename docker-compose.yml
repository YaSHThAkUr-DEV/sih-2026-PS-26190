version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Core Database Pipeline
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dms_db
    ports:
      - "5432:5432"
    volumes:
      - dms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Job Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Object Storage Service
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dms_miniodata:/data

  # ----------------------------------------------------------------------------
  # 4. HashiCorp Vault Transit KMS (Key Management Service)
  # ----------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.15
    container_name: dms-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dms-vault-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

volumes:
  dms_pgdata:
  dms_redisdata:
  dms_miniodata:
